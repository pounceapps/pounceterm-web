<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>card</title>
<style>
  @font-face { font-family: 'JB'; src: local('JetBrains Mono'), local('SF Mono'), local('Menlo'); }
  html, body { margin: 0; padding: 0; background: #050806; }
  .card { position: absolute; top: 0; left: 0; width: 1200px; height: 630px; overflow: hidden;
    font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    background:
      radial-gradient(900px 420px at 8% -12%, rgba(79,214,140,.22) 0%, rgba(79,214,140,0) 60%),
      radial-gradient(700px 380px at 96% 8%, rgba(77,150,255,.20) 0%, rgba(77,150,255,0) 62%),
      linear-gradient(160deg, #0c1611 0%, #080d0a 45%, #060a08 100%); }
  .top { padding: 40px 54px 0; }
  .brand { display: flex; align-items: center; gap: 11px; color: #eaf2ec; font-weight: 700; font-size: 23px; }
  .brand .a { color: #4fd68c; }
  .brand svg { width: 24px; height: 24px; color: #4fd68c; }
  h1 { color: #eaf2ec; font-size: 41px; line-height: 1.1; margin: 20px 0 0; letter-spacing: -.02em; font-weight: 700; }
  h1 em { font-style: normal; color: #4fd68c; }
  .chips { display: flex; gap: 10px; margin-top: 18px; font-size: 15px; }
  .chip { border: 1px solid; border-radius: 999px; padding: 5px 13px; }
  .c1 { color: #4fd68c; border-color: rgba(79,214,140,.45); background: rgba(79,214,140,.10); }
  .c2 { color: #e0a552; border-color: rgba(224,165,82,.45); background: rgba(224,165,82,.10); }
  .c3 { color: #6aa9ff; border-color: rgba(106,169,255,.45); background: rgba(106,169,255,.10); }
  .shotwrap { position: absolute; left: 54px; right: -60px; bottom: -22px; height: 300px; }
  .shotwrap img { width: 1240px; border-radius: 12px; border: 1px solid #24382d;
    box-shadow: 0 -6px 0 rgba(79,214,140,.35), 0 26px 70px rgba(0,0,0,.65); display: block; }
  .url { position: absolute; right: 54px; top: 46px; color: #4fd68c; font-size: 17px; letter-spacing: .02em; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      <span>Pounce<span class="a">TERM</span></span>
    </div>
    <h1 id="h">The macOS terminal built for <em>agentic coding</em></h1>
    <div class="chips" id="chips">
      <span class="chip c1">reads are free</span>
      <span class="chip c2">running asks first</span>
      <span class="chip c3">one profile per org</span>
    </div>
  </div>
  <div class="url">pounceterm.com</div>
  <div class="shotwrap"><img id="img" src="/og/strip-home.png" alt=""></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  if (q.get('h')) document.getElementById('h').innerHTML = q.get('h');
  if (q.get('img')) document.getElementById('img').src = '/og/' + q.get('img');
  if (q.get('chips')) {
    var cls = ['c1','c2','c3'];
    document.getElementById('chips').innerHTML = q.get('chips').split('|')
      .map(function (t, i) { return '<span class="chip ' + cls[i % 3] + '">' + t + '</span>'; }).join('');
  }
</script>
</body>
</html>
